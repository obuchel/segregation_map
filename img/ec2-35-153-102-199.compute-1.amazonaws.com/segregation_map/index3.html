//  CHORD MAPPER 
    //*******************************************************************
function chordMpr(data) {
        var mpr = {},
            mmap = {},
            n = 0,
            matrix = [],
            filter, accessor;

        mpr.setFilter = function(fun) {
                filter = fun;
                return this;
            },
            mpr.setAccessor = function(fun) {
                accessor = fun;
                return this;
            },
            mpr.getMatrix = function() {
                matrix = [];
                _.each(mmap, function(a) {
                    if (!matrix[a.id]) matrix[a.id] = [];
                    _.each(mmap, function(b) {
                        var recs = _.filter(data, function(row) {
                            return filter(row, a, b);
                        })
                        matrix[a.id][b.id] = accessor(recs, a, b);
                    });
                });
                return matrix;
            },
            mpr.getMap = function() {
                return mmap;
            },
            mpr.printMatrix = function() {
                _.each(matrix, function(elem) {
                    console.log(elem);
                })
            },
            mpr.addToMap = function(value, info) {
                if (!mmap[value]) {
                    mmap[value] = {
                        name: value,
                        id: n++,
                        data: info
                    }
                }
            },
            mpr.addValuesToMap = function(varName, info) {
                var values = _.uniq(_.pluck(data, varName));
                _.map(values, function(v) {
                    if (!mmap[v]) {
                        mmap[v] = {
                            name: v,
                            id: n++,
                            data: info
                        }
                    }
                });
                return this;
            }
        return mpr;
}

function chordRdr(matrix, mmap) {
        return function(d) {
            var i, j, s, t, g, m = {};
            if (d.source) {
                i = d.source.index;
                j = d.target.index;
                s = _.where(mmap, {
                    id: i
                });
                t = _.where(mmap, {
                    id: j
                });
                m.sname = s[0].name;
                m.sdata = d.source.value;
                m.svalue = +d.source.value;
                m.stotal = _.reduce(matrix[i], function(k, n) {
                    return k + n
                }, 0);
                m.tname = t[0].name;
                m.tdata = d.target.value;
                m.tvalue = +d.target.value;
                m.ttotal = _.reduce(matrix[j], function(k, n) {
                    return k + n
                }, 0);
            } else {
                g = _.where(mmap, {
                    id: d.index
                });
                m.gname = g[0].name;
                m.gdata = g[0].data;
                m.gvalue = d.value;
            }
            m.mtotal = _.reduce(matrix, function(m1, n1) {
                return m1 + _.reduce(n1, function(m2, n2) {
                    return m2 + n2
                }, 0);
            }, 0);
            return m;
        }
    }

function distance1(lat1, lon1, lat2, lon2, unit) {
    var radlat1 = Math.PI * lat1 / 180
    var radlat2 = Math.PI * lat2 / 180
    var theta = lon1 - lon2
    var radtheta = Math.PI * theta / 180
    var dist = Math.sin(radlat1) * Math.sin(radlat2) + Math.cos(radlat1) * Math.cos(radlat2) * Math.cos(radtheta);
    if (dist > 1) {
        dist = 1;
    }
    dist = Math.acos(dist)
    dist = dist * 180 / Math.PI
    dist = dist * 60 * 1.1515
    if (unit == "K") {
        dist = dist * 1.609344
    }
    if (unit == "N") {
        dist = dist * 0.8684
    }
    return dist;
}

function inRange(x, min, max) {
    return ((x - min) * (x - max) <= 0);
}

function draw_histogram(data) {

    d3.select("#histo").html("");
    var margin2 = {
            top: 20,
            right: 10,
            bottom: 10,
            left: 10
        },
        width = 280 - margin2.left - margin2.right,
        height2 = 160 - margin2.top - margin2.bottom,
        svg2 = d3.select("#histo").append("svg").attr("width", width).attr("height", height2),
        g = svg2.append("g").attr("transform", "translate(" + margin2.left + "," + (-1 * margin2.top) + ")");
    data.forEach(function(d) {
        d.Income = +d.Income;
    });

    var values = data.map(function(d) {
        return d.Income
    });


    var x = d3.scaleLinear()
        .domain(d3.extent(values))
        .rangeRound([0, width - 10]);
    // .nice();

    var histogram = d3.histogram()
        .domain(x.domain())
        .thresholds(d3.range(1, x.domain()[1], (x.domain()[1] - 1) / 10));

    var bins = histogram(values);
    var yiy = [];

    for (var f = 0; f < bins.length; f++) {
        yiy.push(bins[f].length);
    }
    //console.log(yiy);
    var y = d3.scaleLinear()
        .domain([0, (d3.max(yiy) + 5)])
        .range([height2, 30]);

    var bar = g.selectAll(".bar")
        .data(bins)
        .enter().append("g")
        //.attr("class", "bar")
        .attr("transform", function(d) {
            return "translate(" + x(d.x0) + "," + y(d.length) + ")"; //y(Math.log(d.length+1))
        });
    bar.append("rect")
        .style("fill", function(d) {
            if (d.x0 >= income_ranges["0"][0] && d.x1 < income_ranges["1"][0]) {
                //console.log("0",d.x0,d.x1);
                return "#b2182b"; //#ffffb2";

                //console.log("1",d.x0,d.x1);
                return "#ef8a62"; //#fed976";
            } else if (d.x0 >= income_ranges["2"][0] && d.x1 <= income_ranges["3"][0]) {
                //console.log("2",d.x0,d.x1);
                return "#fddbc7"; //#feb24c";
            } else if (d.x0 >= income_ranges["3"][0] && d.x1 <= income_ranges["4"][0]) {
                //console.log("3",d.x0,d.x1);
                return "#d1e5f0"; //#fd8d3c";
            } else if (d.x0 >= income_ranges["4"][0] && d.x1 <= income_ranges["5"][0]) {
                //console.log("4",d.x0,d.x1);
                return "#67a9cf"; //#f03b20";
            } else if (d.x0 >= income_ranges["5"][0] && d.x1 <= income_ranges["5"][1] + 1000) {
                //console.log("5",d.x0,d.x1);
                return "#2166ac"; //#bd0026";




            } else {

                //#b2182b,#ef8a62,#fddbc7,#d1e5f0,#67a9cf,#2166ac

function draw_chord(data, val) {
    // console.log(data,chordMpr(data));

    var mpr = chordMpr(data);

    mpr
        .addValuesToMap('root')
        .addValuesToMap('node')
        .setFilter(function(row, a, b) {
            return (row.root === a.name && row.node === b.name)
        })
        .setAccessor(function(recs, a, b) {
            if (!recs[0]) return 0;
            return +recs[0].count;
        });
    drawChords(mpr.getMatrix(), mpr.getMap(), data, val);
}
